name: Google Calendar example
on:
  pull_request:
    paths:
      - 'examples/medplum-google-calendar-sync/**'
      - '.github/workflows/google-calendar.yml'
      - 'tsconfig.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/medplum-google-calendar-sync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --workspaces=false
      - run: npm run profiles
      - run: git diff --exit-code -- profiles
      - run: npm test
      - run: npm run build
