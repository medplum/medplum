on:
  pull_request_target:
    types: [opened, reopened]

name: "Vouch - Check PR"

# Deny by default. Job-level permissions replace this rather than merging with
# it, so each job below grants exactly what it needs and anything added later
# starts from nothing.
permissions: {}

jobs:
  check:
    permissions:
      issues: write
      pull-requests: write
      contents: read
    uses: ./.github/workflows/vouch-check-pr-shared.yml
    with:
      pr-number: ${{ github.event.pull_request.number }}
    secrets: inherit
