name: Documentation assistant (manual pilot)

# Keep manual-only until classifications and drafts have been evaluated.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged PR number targeting the default branch
        required: true
        type: string
      mode:
        description: Classify, save a draft, or publish the result to GitHub
        type: choice
        default: draft
        options: [classify, draft, open-pr]

concurrency:
  group: docs-automation-${{ github.repository }}-${{ inputs.pr_number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  analyze:
    runs-on: medplum-build-16core
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      publication: ${{ steps.validation.outputs.publication }}
      base_sha: ${{ steps.prepare.outputs.base_sha }}
    steps:
      - name: Check out reviewed automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out current documentation and implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: repo
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: repo/package-lock.json
      - name: Install npm from packageManager
        run: corepack enable npm
      - name: Collect source change and configure bounded agent calls
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          MODE: ${{ inputs.mode }}
        run: node scripts/docs-automation/run.ts prepare
      - name: Classify documentation impact
        id: classify
        timeout-minutes: 20
        if: steps.prepare.outputs.analyze == 'true'
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          settings: scripts/docs-automation/agent-settings.json
          prompt: Read scripts/docs-automation/prompts/classify.md and follow its instructions. Return the requested structured result.
          claude_args: ${{ steps.prepare.outputs.classify_args }}
      - name: Validate and save classification
        id: classification
        if: steps.prepare.outputs.analyze == 'true'
        env:
          EXECUTION_FILE: ${{ steps.classify.outputs.execution_file }}
        run: node scripts/docs-automation/run.ts classify
      - name: Draft proposed documentation
        id: draft
        timeout-minutes: 20
        if: inputs.mode != 'classify' && steps.classification.outputs.draft_args != ''
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          settings: scripts/docs-automation/agent-settings.json
          prompt: Read scripts/docs-automation/prompts/draft.md and follow its instructions. Edit only the planned files, then return the requested structured result.
          claude_args: ${{ steps.classification.outputs.draft_args }}
      - name: Check and capture drafted edits
        id: apply
        if: steps.draft.outcome == 'success'
        env:
          EXECUTION_FILE: ${{ steps.draft.outputs.execution_file }}
        run: node scripts/docs-automation/run.ts draft
      - name: Install documentation dependencies
        id: install
        timeout-minutes: 10
        if: steps.apply.outputs.applied == 'true'
        working-directory: repo
        run: npm ci
      - name: Independently verify the proposed documentation
        id: verify
        timeout-minutes: 20
        if: steps.apply.outputs.applied == 'true'
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          settings: scripts/docs-automation/agent-settings.json
          prompt: Read scripts/docs-automation/prompts/verify.md and independently verify the draft. Return the requested structured result.
          claude_args: ${{ steps.prepare.outputs.verify_args }}
      - name: Validate and save the verification
        id: verification
        if: steps.verify.outcome == 'success'
        env:
          EXECUTION_FILE: ${{ steps.verify.outputs.execution_file }}
        run: node scripts/docs-automation/run.ts verify
      - name: Build documentation
        id: build
        timeout-minutes: 30
        if: steps.verification.outcome == 'success'
        working-directory: repo
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
        run: |
          if [ -n "$TURBO_TOKEN" ]; then
            export TURBO_CACHE=remote:rw
          else
            unset TURBO_TOKEN TURBO_TEAM
          fi
          npm run build:docs
      - name: Record validation results and publication decision
        id: validation
        if: ${{ !cancelled() && (success() || steps.install.outcome == 'failure' || steps.build.outcome == 'failure') }}
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
        run: node scripts/docs-automation/run.ts validation
      - name: Summarize decisions, evidence, and checks
        if: always()
        run: node scripts/docs-automation/run.ts summary
      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-review-${{ inputs.pr_number }}
          path: .docs-run/
          include-hidden-files: true
          retention-days: 14

  publish:
    # A failed install/build can still leave a source-PR comment. Only a successful job can open a PR.
    if: >-
      ${{ !cancelled() && inputs.mode == 'open-pr' &&
          (needs.analyze.outputs.publication == 'comment' ||
           (needs.analyze.result == 'success' && needs.analyze.outputs.publication == 'pr')) }}
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.analyze.outputs.base_sha }}
          path: repo
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Download validated draft
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: docs-review-${{ inputs.pr_number }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir .docs-run
      - name: Open the draft PR or comment on the source PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/docs-automation/run.ts publish
      - name: Summarize publication
        if: always()
        run: node scripts/docs-automation/run.ts summary
      - name: Upload publication result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-publication-${{ inputs.pr_number }}
          path: .docs-run/publication.json
          retention-days: 14
