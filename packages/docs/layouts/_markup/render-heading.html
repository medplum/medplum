{{- /* Headings with a "#" link to themselves, shown on hover, as Docusaurus renders them (styled in main.css) */ -}}
<h{{ .Level }} id="{{ .Anchor }}"
  {{- range $key, $value := .Attributes }}{{ if ne $key "id" }} {{ $key }}="{{ $value }}"{{ end }}{{ end -}}
>
  {{- .Text -}}
  {{- /* From .Text: .PlainText stops at code or a link inside emphasis */}}
  {{- $label := printf "Direct link to %s" (.Text | plainify | htmlUnescape) -}}
  <a href="#{{ .Anchor }}" class="hash-link" aria-label="{{ $label }}" title="{{ $label }}" translate="no">&#8203;</a>
</h{{ .Level }}>
