notes:
  - "**Free**: recommended for prototyping or learning. See [Why Open Source](/open-source)."
  - "**Production**: recommended for production applications, e.g. treatment of patients or conducting research."
  - "**Premium**: Includes diagnostics, lab and medication integrations. Recommended for messaging heavy and integration heavy use cases."
  - "**Enterprise**: recommended for institutions with complex workflow, integration or data requirements. Read more details on our [Enterprise](/enterprise) offering page."
  - "**Community**: refers to self-hosting the [Medplum application](https://github.com/medplum/medplum). See [Why Open Source](/open-source)."
  - "**Enterprise Self-Hosted**: recommended for those who must host the application on their own cloud infrastructure. Read more details on our [Enterprise](/enterprise) offering page."
  - "**Bot Invocations**: refers to custom logic written by customers to execute their workflow. [Automation](https://www.medplum.com/products/bots) documentation and [integration](https://www.medplum.com/products/integration) are a good place to learn more."
  - "**Required authentication methods**: Organizations can require that all logins at their domain go through their identity provider of choice."
  - "**Compliance**: Many complex compliance scenarios can be supported with this infrastructure. You can read more on the [compliance page](https://www.medplum.com/docs/compliance)."
  - "**Websocket Subscriptions**: maximal number of concurrent websocket [subscriptions](https://www.medplum.com/docs/subscriptions) available."
  - "**Audit Support**: receive support during common audits common in health system and payor partnerships."
  - "**External Identity Providers**: connect your Okta, Azure SSO, Auth0 or other oAuth based identity provider."
  - "**Test Usage**: For low-volume use cases such as development, testing, or small internal tools."
  - "**Growth Usage**: Supports moderate usage typical of production deployments or lightweight applications."
  - "**Scale Usage**: Designed for high-throughput environments with sustained and growing traffic."
  - "**Enterprise Usage**: Handles very high or mission-critical volumes, with customization and service level guarantees."
  - "**Cloud Hosted**: Medplum is available for purchase through [AWS Marketplace](https://aws.amazon.com/marketplace/pp/prodview-gfbi35l2l7mma?sr=0-1&ref_=beagle&applicationId=AWSMPContessa)."
  - "**Data Warehouse**: scheduled synchronization of FHIR resources to open Apache Iceberg tables, queried in place from [Snowflake](https://www.medplum.com/docs/analytics/snowflake), [Amazon Redshift](https://www.medplum.com/docs/analytics/redshift) and other engines."
