# The pricing page (layouts/_default/pricing.html); src/components/Pricing/pricing-data.ts on the Docusaurus site.
#
# plans: the plan cards, left to right; each comparison row has a value for each plan id.
# A value is true (included), false (not included), text, or text plus a link: {text, link: {text, href}}.

salesUrl: https://cal.com/forms/9da7bfa2-40f5-461d-ad64-33d20bd32a7a
plans:
