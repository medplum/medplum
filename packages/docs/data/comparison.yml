groups:
  - id: ehr
    title: EHR Platforms
    icon: outline/replace
    tagline: Evaluating a replacement for your current EHR?
    defaults: [healthie, canvas]
    competitors:
      - { id: medplum, name: Medplum }
      - { id: healthie, name: Healthie }
      - { id: canvas, name: Canvas }
      - { id: elation, name: Elation }
      - { id: athenaone, name: athenaOne }
      - { id: modmed, name: ModMed EMA }
      - { id: salesforce, name: Agentforce Health (formerly Health Cloud) }
    rows:
      - id: customize-app
        label: Change the clinical app
        cells:
          medplum: '**Full application source.** Change any screen or application logic in Provider.'
          healthie: '**Configuration and extensions.** Configure Healthie and embed custom apps (Enterprise).'
          canvas: '**Plugins and embedded apps.** Extend screens, workflows, and data models through the SDK.'
          elation: '**Configuration and extensions.** Configure Elation and launch SMART apps from the chart.'
          athenaone: '**Configuration and extensions.** Configure athenaOne and embed SMART apps.'
          modmed: '**Configuration and extensions.** Configure EMA and connect approved partner apps.'
          salesforce: '**Low-code and code.** Build custom screens and logic with Salesforce tools.'
      - id: custom-app
        label: Build a custom clinical app
        cells:
          medplum: '**FHIR APIs + healthcare React library.** Build with the APIs and components behind Provider.'
          healthie: '**GraphQL APIs + React SDKs.** SDKs for chat, forms, booking, and packages.'
          canvas: '**FHIR APIs + SDK.** Build with supported FHIR writes and custom plugin endpoints.'
          elation: '**REST APIs.** Build around supported workflows; FHIR access is read-only.'
          athenaone: '**Partner APIs.** Use proprietary APIs for writes; FHIR is mostly read-only.'
          modmed: '**Approved APIs.** Use proprietary APIs for writes; certified FHIR is read-only.'
          salesforce: '**Salesforce frameworks.** Build with Lightning components and Experience Cloud.'
      - id: organization
        label: Organize practices and service lines
        cells:
          medplum: '**Custom organizational model.** Define which practices, services, and teams share records.'
          healthie: '**Sub-organizations.** Organize clinics and configure sharing (Enterprise).'
          canvas: '**Patient groups.** Share patients across panels, sites, and programs.'
          elation: '**Workspaces and cohorts.** Organize schedules and patient access by group.'
          athenaone: '**Chart-sharing groups.** Choose which practices share patient charts.'
          modmed: '**Multi-practice support.** Practice groups and MSOs.'
          salesforce: '**Custom sharing model.** Define organizational hierarchies and record-sharing rules.'
      - id: access
        label: Set detailed permissions
        cells:
          medplum: '**Custom access policies.** Control access to records, individual fields, and actions.'
          healthie: '**User and team permissions.** Configure permissions with templates and care-team settings.'
          canvas: '**Custom roles.** Set permissions for record types, actions, and features.'
          elation: '**Custom roles.** Define user privileges and restrict access to patient charts.'
          athenaone: '**Standard roles.** Assign permissions through predefined roles.'
          modmed: '**Role permissions.** Assign access by staff role.'
          salesforce: '**Field-level security.** Configure record, field, and action permissions.'
      - id: automation
        label: Add custom workflow logic
        cells:
          medplum: '**Hosted or external code.** Run Bots on Medplum or send events directly to your services.'
          healthie: '**External code.** Use APIs and webhooks; configurable automations are also available.'
          canvas: '**Hosted or external code.** Run Python plugins and connect them to your services.'
          elation: '**External code.** Use APIs and webhooks to run your own workflows.'
          athenaone: '**External code.** Use APIs, event notifications, and clinical decision-support hooks.'
          modmed: '**External code.** Connect your services through approved APIs and HL7 feeds.'
          salesforce: '**Hosted or external code.** Run Apex and Flow, or connect your services through APIs and events.'
      - id: data-model
        label: Clinical data model
        cells:
          medplum: '**FHIR-native.** Build directly on FHIR records and read/write APIs.'
          healthie: '**Healthie schema.** Build through GraphQL; a FHIR exchange API is an Enterprise add-on.'
          canvas: '**FHIR-native.** FHIR APIs and custom SDK models; writes vary by resource.'
          elation: '**Elation schema.** REST application APIs; FHIR read access and export.'
          athenaone: '**athenahealth schema.** Proprietary application APIs; mostly read-only FHIR, plus export.'
          modmed: '**EMA schema.** Proprietary application APIs; FHIR read access and export.'
          salesforce: '**FHIR-aligned objects.** Map between Salesforce records and standard FHIR.'
      - id: platform-control
        label: Platform source and hosting
        cells:
          medplum: '**Open source.** Apache 2.0 server, apps, and SDKs; managed or self-hosted.'
          healthie: '**Proprietary platform.** Healthie-hosted.'
          canvas: '**Proprietary platform.** Canvas-hosted, with a dedicated customer instance.'
          elation: '**Proprietary platform.** Elation-hosted.'
          athenaone: '**Proprietary platform.** athenahealth-hosted.'
          modmed: '**Proprietary platform.** ModMed-hosted.'
          salesforce: '**Proprietary platform.** Salesforce-hosted.'
      - id: certification
        label: ONC certification
        cells:
          medplum: '**ONC-certified.**'
          healthie: '**ONC-certified.**'
          canvas: '**ONC-certified.**'
          elation: '**ONC-certified.**'
          athenaone: '**ONC-certified.**'
          modmed: '**ONC-certified.**'
          salesforce: '**Not ONC-certified.**'
  - id: platforms
    title: Developer Platforms
    icon: outline/code
    tagline: Choosing the foundation for your clinical application?
    defaults: [oystehr, aidbox]
    competitors:
      - { id: medplum, name: Medplum }
      - { id: oystehr, name: Oystehr }
      - { id: aidbox, name: Aidbox }
      - { id: hapi, name: HAPI FHIR (open source) }
      - { id: healthlake, name: AWS HealthLake }
      - { id: google, name: Google Cloud Healthcare API }
    rows:
      - id: clinical-app
        label: Start with a clinical app
        cells:
          medplum: '**Open-source Provider.** Use it as-is or customize its full application source.'
          oystehr: '**Source-available Ottehr.** Customize its app under a license with reuse restrictions.'
          aidbox: '**Assemble your app.** Start with backend modules and Formbox forms.'
          hapi: '**Build your app.** The platform supplies the FHIR server.'
          healthlake: '**Build your app.** The service supplies the FHIR data backend.'
          google: '**Build your app.** The service supplies healthcare data APIs.'
      - id: ui-components
        label: Reuse clinical UI
        cells:
          medplum: '**Healthcare React library.** Reuse forms, search, timelines, scheduling, and messaging.'
          oystehr: "**Bundled with Ottehr.** Reuse app components under Ottehr's license."
          aidbox: '**React UI and FHIR tooling.** Use its component library and Formbox for clinical forms.'
          hapi: '**Build or source.** Add your own clinical UI.'
          healthlake: '**Build or source.** Add your own clinical UI.'
          google: '**Build or source.** Add your own clinical UI.'
      - id: platform-control
        label: Platform source and hosting
        cells:
          medplum: '**Open source.** Apache 2.0 server, apps, and SDKs; managed or self-hosted.'
          oystehr: "**Proprietary backend.** Oystehr-hosted; Ottehr's app source is available separately."
          aidbox: '**Proprietary core.** Managed or self-hosted under a commercial license.'
          hapi: '**Open-source core.** Apache 2.0; you host and operate the server.'
          healthlake: '**Proprietary managed service.** AWS hosts and operates the backend.'
          google: '**Proprietary managed service.** Google hosts and operates the backend.'
      - id: organization
        label: Organize practices and service lines
        cells:
          medplum: '**Custom organizational model.** Define which practices, services, and teams share records.'
          oystehr: '**Project-based data.** Build your sharing model within a project.'
          aidbox: '**Hierarchy or custom policies.** Share records across organizations using either approach.'
          hapi: '**Server-defined partitions.** Implement separation and sharing in your server.'
          healthlake: '**Separate data stores.** Build cross-practice sharing around the service.'
          google: '**Separate data stores.** Use consent rules for access within a store.'
      - id: access
        label: Set detailed permissions
        cells:
          medplum: '**Custom access policies.** Control access to records, individual fields, and actions.'
          oystehr: '**Resource/action policies.** Define which records users can access and change.'
          aidbox: '**Custom policies and masking.** Define access rules and hide sensitive fields.'
          hapi: '**Server-side code.** Implement authorization and field redaction in Java.'
          healthlake: '**IAM and SMART scopes.** Configure service permissions and patient-access rules.'
          google: '**IAM and consent.** Configure service permissions and consent-based read access.'
      - id: identity
        label: Sign-in and identity
        cells:
          medplum: '**Built-in accounts.** Custom sign-in, external identity providers, and SCIM user provisioning.'
          oystehr: '**Built-in accounts.** Connect external identity providers, including SAML SSO.'
          aidbox: '**Built-in accounts.** Connect external identity providers and SMART apps.'
          hapi: '**Integrate your own.** Add an identity provider and application authentication.'
          healthlake: '**Integrate your own.** Add application authentication and configure SMART access.'
          google: '**Integrate your own.** Add application authentication and a SMART proxy.'
      - id: automation
        label: Add custom workflow logic
        cells:
          medplum: '**Hosted or external code.** Run Bots on Medplum or send events directly to your services.'
          oystehr: '**Hosted or external code.** Run Zambdas and connect them to your services.'
          aidbox: '**External code and SQL.** Use webhooks or proxied apps; SQL triggers are in alpha.'
          hapi: '**Server or external code.** Run Java interceptors or send events to your services.'
          healthlake: '**External code.** Run your services in response to data-change notifications.'
          google: '**External code.** Run your services in response to Pub/Sub notifications.'
      - id: integrations
        label: Prebuilt clinical integrations
        cells:
          medplum: '**Prebuilt integrations.**'
          oystehr: '**Prebuilt integrations.**'
          aidbox: '**Optional modules.**'
          hapi: '**Integrate separately.** Build or source the clinical connections.'
          healthlake: '**Integrate separately.** Build or source the clinical connections.'
          google: '**Integrate separately.** Build or source the clinical connections.'
      - id: certification
        label: ONC certification scope
        cells:
          medplum: '**Certified EHR and API.**'
          oystehr: '**Certified API module.**'
          aidbox: '**Certified API module.**'
          hapi: '**Not ONC-certified.**'
          healthlake: '**Not ONC-certified.**'
          google: '**Not ONC-certified.**'
