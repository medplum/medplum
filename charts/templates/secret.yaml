# Operator-supplied secrets only. When configSource points at a cloud
# secret store, database/redis credentials live there (written by
# Terraform) and never touch Kubernetes; the entries here are for env-only
# installs and operator overrides. Empty values are NOT rendered — an
# empty env var would override the secret store's real value in the merge.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "medplum.fullname" . }}-secrets
  labels:
    {{- include "medplum.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Server configuration
  {{- with .Values.config.server }}
  {{- with .signingKeyPassphrase }}
  MEDPLUM_SIGNING_KEY_PASSPHRASE: {{ . | quote }}
  {{- end }}
  {{- with .signingKey }}
  MEDPLUM_SIGNING_KEY: {{ . | quote }}
  {{- end }}
  {{- with .googleClientSecret }}
  MEDPLUM_GOOGLE_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .recaptchaSecretKey }}
  MEDPLUM_RECAPTCHA_SECRET_KEY: {{ . | quote }}
  {{- end }}
  {{- end }}

  # Database configuration
  {{- with .Values.config.database.password }}
  MEDPLUM_DATABASE_PASSWORD: {{ . | quote }}
  {{- end }}

  # Redis configuration
  {{- with .Values.config.redis.password }}
  MEDPLUM_REDIS_PASSWORD: {{ . | quote }}
  {{- end }}
