# Empty string values are deliberately NOT rendered: with a multi-source
# configSource ("<cloud-secret>,env") the env layer wins the merge, and an
# empty env var would override the secret store's real value.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "medplum.fullname" . }}-config
  labels:
    {{- include "medplum.labels" . | nindent 4 }}
data:
  # Server configuration
  {{- with .Values.config.server }}
  MEDPLUM_BASE_URL: {{ .baseUrl | required "config.server.baseUrl is required" | quote }}
  MEDPLUM_PORT: {{ .port | quote }}
  {{- with .appBaseUrl }}
  MEDPLUM_APP_BASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .binaryStorage }}
  MEDPLUM_BINARY_STORAGE: {{ . | quote }}
  {{- end }}
  {{- with .storageBaseUrl }}
  MEDPLUM_STORAGE_BASE_URL: {{ . | quote }}
  {{- end }}
  {{- with .signingKeyId }}
  MEDPLUM_SIGNING_KEY_ID: {{ . | quote }}
  {{- end }}
  {{- with .supportEmail }}
  MEDPLUM_SUPPORT_EMAIL: {{ . | quote }}
  {{- end }}
  {{- with .googleClientId }}
  MEDPLUM_GOOGLE_CLIENT_ID: {{ . | quote }}
  {{- end }}
  {{- with .recaptchaSiteKey }}
  MEDPLUM_RECAPTCHA_SITE_KEY: {{ . | quote }}
  {{- end }}
  {{- with .maxJsonSize }}
  MEDPLUM_MAX_JSON_SIZE: {{ . | quote }}
  {{- end }}
  {{- with .maxBatchSize }}
  MEDPLUM_MAX_BATCH_SIZE: {{ . | quote }}
  {{- end }}
  MEDPLUM_VM_CONTEXT_BOTS_ENABLED: {{ .vmContextBotsEnabled | quote }}
  MEDPLUM_DEFAULT_BOT_RUNTIME_VERSION: {{ .defaultBotRuntimeVersion | quote }}
  {{- with .emailProvider }}
  MEDPLUM_EMAIL_PROVIDER: {{ . | quote }}
  {{- end }}
  {{- with .allowedOrigins }}
  MEDPLUM_ALLOWED_ORIGINS: {{ . | quote }}
  {{- end }}
  MEDPLUM_INTROSPECTION_ENABLED: {{ .introspectionEnabled | quote }}
  {{- end }}

  # Database configuration
  {{- with .Values.config.database }}
  {{- with .host }}
  MEDPLUM_DATABASE_HOST: {{ . | quote }}
  {{- end }}
  {{- with .port }}
  MEDPLUM_DATABASE_PORT: {{ . | quote }}
  {{- end }}
  {{- with .dbname }}
  MEDPLUM_DATABASE_DBNAME: {{ . | quote }}
  {{- end }}
  {{- with .username }}
  MEDPLUM_DATABASE_USERNAME: {{ . | quote }}
  {{- end }}
  {{- end }}

  # Redis configuration
  {{- with .Values.config.redis }}
  {{- with .host }}
  MEDPLUM_REDIS_HOST: {{ . | quote }}
  {{- end }}
  {{- with .port }}
  MEDPLUM_REDIS_PORT: {{ . | quote }}
  {{- end }}
  {{- if hasKey . "tls" }}
  # The server JSON-parses this value ({} = TLS on with public CA;
  # {"ca": "<pem>"} = private CA). hasKey because {} is falsy in helm.
  MEDPLUM_REDIS_TLS: {{ .tls | toJson | quote }}
  {{- end }}
  {{- end }}

  # Fission
  {{- with .Values.config.fission }}
  MEDPLUM_FISSION_NAMESPACE: {{ .namespace | quote }}
  MEDPLUM_FISSION_ROUTER_HOST: {{ .routerHost | quote }}
  MEDPLUM_FISSION_ROUTER_PORT: {{ .routerPort | quote }}
  MEDPLUM_FISSION_ENVIRONMENT_NAME: {{ .environmentName | quote }}
  MEDPLUM_FISSION_FIELD_MANAGER: {{ .fieldManager | quote }}
  {{- end }}
